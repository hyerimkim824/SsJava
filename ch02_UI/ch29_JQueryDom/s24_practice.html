<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src ="../js/jquery-3.7.1.min.js"></script>
    <script type ="text/javascript">
        /*
        [문제] 도서정보를 table에 표시

        도서명     분류     정상가격     할인가격(5%)
        자바       IT       20,000원    19,000원
        미술사     예술      30,000원    28,500원
        노래연습   예술      10,000원     9,500원
        한국사     역사      50,000원    47,000원
        */

        $(function(){



            const book = [
                //{name:'도서명',category:'분류',price:'정상가격'},
                {name:'자바',category:'IT',price:20000},
                {name:'미술사',category:'예술',price:30000},
                {name:'노래연습',category:'예술',price:10000},
                {name:'한국사',category:'역사',price:50000},

            ];

            function discount(a){
                return a*0.95;
            }

            let ouput ='';
            $(book).each(function(index,item){

                output +='<tr>';
                output +='<td>'+item.name+'</td>';
                output +='<td>'+item.category+'</td>';
                output +='<td>'+item.price.toLocaleString()+'</td>';
                output +='<td>' +discount(item.price).toLocaleString()+'</td>'
                output +='</tr>';

            });

            $('#output').append(output);

        });
    </script>
    <title>jQeury</title>
</head>
<body>
    <table id ="output" border ="1">
        <tr>
            <td>도서명</td>
            <td>분류</td>
            <td>정상가격</td>
            <td>할인가격 5%</td>
        </tr>

    </table>
    
</body>
</html>
