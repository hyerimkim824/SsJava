<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 장치에서 웹사이트가 원하는 사이즈로 보여지게 처리 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" type="text/css"> 
</head>
<body>
    <div class="container">
        <h4>기본 form</h4>
        <form>
            <!-- mb-3 : 요소의 맨 아래에 1rem의 여백을 추가 -->
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password">
            </div>
            <!-- form-check : 라디오 버튼과 체크박스를 위한 CSS 클래스
                 레이아웃과 동작을 개선하여 보다 높은 맞춤성과 크로스
                 브라우저의 일관성을 제공 -->
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="check1">
                <label for="check1" class="form-check-label">Check me out</label>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>

        <h4>Horizontal from</h4>
        <form>
            <div class="row mb-3">
                <label for="email2" class="col-sm-2 col-form-label">Email</label>
                <div class="col-sm-10">
                    <input type="email" class="form-control" id="email2">
                </div>
            </div>
            <div class="row mb-3">
                <label for="password2" class="col-sm-2 col-form-label">Password</label>
                <div class="col-sm-10">
                    <input type="password" class="form-control" id="password2">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-sm-10 offset-sm-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox"
                                                        id="check2">
                        <label class="form-check-label" for="check2">
                            Check me out
                        </label>                                
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>

        <h4>Floating labels</h4>
        <div class="form-floating mb-3">
           <input type="email" class="form-control" id="email3"
                           placeholder="name@example.com">
           <label for="email3">Email address</label>                 
        </div>
        <div class="form-floating">
            <input type="password" class="form-control" id="password3"
                            placeholder="Password">
            <label for="password3">Password</label>                 
         </div>

    </div>

    <!-- Optional JavaScript -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
</body>
</html>
